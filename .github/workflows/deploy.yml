name: Deploy TIOP web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/tiop-web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tiop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # serve under https://<user>.github.io/scientific-intelligence-platform/
          VITE_BASE: /scientific-intelligence-platform/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/tiop-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
